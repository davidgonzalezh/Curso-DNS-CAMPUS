name: Deploy RC4.2 student package

on:
  push:
    paths:
      - payload-rc4_2.zip.b64
      - .github/workflows/deploy-rc4_2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode and replace the student package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy-rc4_2
          mkdir -p .deploy-rc4_2/package
          base64 --decode payload-rc4_2.zip.b64 > .deploy-rc4_2/package.zip
          unzip -q .deploy-rc4_2/package.zip -d .deploy-rc4_2/package

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'payload-rc4_2.zip.b64' \
            -exec rm -rf {} +

          cp -a .deploy-rc4_2/package/. .
          rm -rf .deploy-rc4_2
          rm -f payload-rc4_2.zip.b64
          rm -f .github/workflows/deploy-rc4_2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit corrected package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publicar paquete estudiantil RC4.2 corregido'
          git push
